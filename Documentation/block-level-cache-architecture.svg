<svg viewBox="0 0 870 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Block-level cache architecture: SFTPClient uses the SFTPBlockLevelReadCache protocol; ReferenceCache conforms to it and keeps bytes in the CacheStorage protocol; InMemoryCacheStorage conforms to CacheStorage.">
<style>
    .surface { fill: #fcfcfb; }
    .card-stroke { stroke: rgba(11,11,11,0.10); }
    .ink { fill: #0b0b0b; }
    .secondary { fill: #52514e; }
    .muted { fill: #898781; }
    .line { stroke: #52514e; }
    .head { fill: #52514e; }
    .hollow { fill: #fcfcfb; stroke: #52514e; }
    .protocol { fill: #fcfcfb; stroke: #52514e; }
    .impl { fill: #eaf2fc; stroke: #2a78d6; }
    .client { fill: #eeede7; stroke: rgba(11,11,11,0.25); }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .card-stroke { stroke: rgba(255,255,255,0.10); }
      .ink { fill: #ffffff; }
      .secondary { fill: #c3c2b7; }
      .muted { fill: #898781; }
      .line { stroke: #c3c2b7; }
      .head { fill: #c3c2b7; }
      .hollow { fill: #1a1a19; stroke: #c3c2b7; }
      .protocol { fill: #1a1a19; stroke: #c3c2b7; }
      .impl { fill: #1b2a3c; stroke: #3987e5; }
      .client { fill: #2c2c2a; stroke: rgba(255,255,255,0.25); }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    .name { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
    .stereo { font-size: 11px; font-style: italic; }
    .role { font-size: 11.5px; }
    .label { font-size: 12px; }
    .legend { font-size: 11.5px; }
</style>

<rect x="8" y="8" width="854" height="454" rx="24" ry="24" class="surface card-stroke" stroke-width="1"/>
<text x="435" y="44" text-anchor="middle" font-size="19" font-weight="700" class="ink">Block-Level Cache</text>

<!-- Row 0: SFTPClient -->
<rect x="30" y="70" width="230" height="72" rx="10" class="client" stroke-width="1.5"/>
<text x="145" y="102" text-anchor="middle" class="name ink">SFTPClient</text>
<text x="145" y="122" text-anchor="middle" class="role secondary">reads, writes, and changes files</text>

<!-- SFTPClient uses SFTPBlockLevelReadCache -->
<line x1="145" y1="142" x2="145" y2="180" class="line" stroke-width="1.5"/>
<polygon points="145,190 139,179 151,179" class="head"/>
<text x="158" y="162" class="label secondary">asks before reading,</text>
<text x="158" y="177" class="label secondary">reports every change</text>

<!-- Row 1: SFTPBlockLevelReadCache (protocol) -->
<rect x="30" y="190" width="230" height="72" rx="10" class="protocol" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="145" y="208" text-anchor="middle" class="stereo muted">«protocol»</text>
<text x="145" y="228" text-anchor="middle" class="name ink">SFTPBlockLevelReadCache</text>
<text x="145" y="248" text-anchor="middle" class="role secondary">which bytes are still current</text>

<!-- ReferenceCache conforms to SFTPBlockLevelReadCache -->
<line x1="274" y1="226" x2="320" y2="226" class="line" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="261,226 274,219 274,233" class="hollow" stroke-width="1.5"/>

<!-- Row 1: ReferenceCache -->
<rect x="320" y="190" width="230" height="72" rx="10" class="impl" stroke-width="1.5"/>
<text x="435" y="222" text-anchor="middle" class="name ink">ReferenceCache</text>
<text x="435" y="242" text-anchor="middle" class="role secondary">the cache this package ships</text>

<!-- ReferenceCache uses CacheStorage -->
<line x1="435" y1="262" x2="435" y2="300" class="line" stroke-width="1.5"/>
<polygon points="435,310 429,299 441,299" class="head"/>
<text x="448" y="290" class="label secondary">keeps bytes in</text>

<!-- Row 2: CacheStorage (protocol) -->
<rect x="320" y="310" width="230" height="72" rx="10" class="protocol" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="435" y="328" text-anchor="middle" class="stereo muted">«protocol»</text>
<text x="435" y="348" text-anchor="middle" class="name ink">CacheStorage</text>
<text x="435" y="368" text-anchor="middle" class="role secondary">where bytes live, how many to keep</text>

<!-- InMemoryCacheStorage conforms to CacheStorage -->
<line x1="564" y1="346" x2="610" y2="346" class="line" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="551,346 564,339 564,353" class="hollow" stroke-width="1.5"/>

<!-- Row 2: InMemoryCacheStorage -->
<rect x="610" y="310" width="230" height="72" rx="10" class="impl" stroke-width="1.5"/>
<text x="725" y="342" text-anchor="middle" class="name ink">InMemoryCacheStorage</text>
<text x="725" y="362" text-anchor="middle" class="role secondary">the storage this package ships</text>

<!-- Legend -->
<rect x="70" y="418" width="26" height="16" rx="4" class="protocol" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="104" y="430" class="legend secondary">protocol</text>
<rect x="210" y="418" width="26" height="16" rx="4" class="impl" stroke-width="1.5"/>
<text x="244" y="430" class="legend secondary">implementation (replaceable)</text>
<polygon points="440,426 451,420 451,432" class="hollow" stroke-width="1.5"/>
<line x1="451" y1="426" x2="482" y2="426" class="line" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="492" y="430" class="legend secondary">conforms to</text>
<line x1="620" y1="426" x2="644" y2="426" class="line" stroke-width="1.5"/>
<polygon points="654,426 643,420 643,432" class="head"/>
<text x="664" y="430" class="legend secondary">uses</text>
</svg>
