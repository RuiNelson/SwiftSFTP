<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="sftp-t">
  <title id="sftp-t">SwiftSFTP — Fast, async SFTP and SSH for Swift</title>
  <defs>
    <linearGradient id="sftp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="1" stop-color="#16161D"/>
    </linearGradient>
    <radialGradient id="sftp-glowR" cx="1010" cy="160" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A2B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF6A2B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sftp-glowL" cx="150" cy="160" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9F43" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF9F43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sftp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="0.55" stop-color="#FF6A2B"/>
      <stop offset="1" stop-color="#EE3B3B"/>
    </linearGradient>
    <linearGradient id="sftp-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sftp-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="1" stop-color="#FF5A36"/>
    </linearGradient>
    <pattern id="sftp-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#fff"/>
    </pattern>
    <linearGradient id="sftp-fade" x1="560" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="sftp-dotmask"><rect x="560" y="0" width="720" height="320" fill="url(#sftp-fade)"/></mask>
    <filter id="sftp-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="sftp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#FF6A2B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#sftp-bg)"/>
  <rect width="1280" height="320" fill="url(#sftp-glowL)"/>
  <rect width="1280" height="320" fill="url(#sftp-glowR)"/>
  <rect x="560" width="720" height="320" fill="url(#sftp-dots)" opacity="0.10" mask="url(#sftp-dotmask)"/>

  <!-- App-icon tile -->
  <g filter="url(#sftp-glow)">
    <rect x="80" y="96" width="128" height="128" rx="30" fill="url(#sftp-tile)"/>
  </g>
  <rect x="80" y="96" width="128" height="128" rx="30" fill="url(#sftp-sheen)"/>
  <rect x="80.5" y="96.5" width="127" height="127" rx="29.5" fill="none" stroke="#fff" stroke-opacity="0.28"/>
  <!-- folder with upload arrow -->
  <path d="M108 144a8 8 0 0 1 8-8h20l8 8h28a8 8 0 0 1 8 8v30a8 8 0 0 1-8 8h-56a8 8 0 0 1-8-8z" fill="#fff" fill-opacity="0.96"/>
  <path d="M144 180v-22M135 166l9-9 9 9" fill="none" stroke="#F2502E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lock badge -->
  <circle cx="180" cy="192" r="15" fill="#15151B" stroke="#FF8A4C" stroke-opacity="0.9" stroke-width="1.5"/>
  <rect x="173.5" y="192" width="13" height="10" rx="2.5" fill="#fff"/>
  <path d="M176 192v-2.5a4 4 0 0 1 8 0V192" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Wordmark -->
  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="248" y="106" font-size="13" font-weight="600" letter-spacing="2.6" fill="#FF8A4C">SWIFT PACKAGE</text>
    <text x="246" y="164" font-size="62" font-weight="700" letter-spacing="-1.8" fill="#fff">Swift<tspan fill="url(#sftp-word)">SFTP</tspan></text>
    <text x="248" y="198" font-size="22" font-weight="400" fill="#A1A1AA">Fast, async SFTP and SSH for Swift.</text>
    <text x="248" y="238" font-size="13.5" font-weight="500" letter-spacing="0.2" fill="#8E8E93">macOS  ·  iOS  ·  visionOS  ·  watchOS  ·  tvOS  ·  Linux  ·  Android</text>
  </g>

  <!-- Code window -->
  <g filter="url(#sftp-shadow)">
    <rect x="760" y="56" width="440" height="208" rx="16" fill="#1B1B21"/>
  </g>
  <rect x="760.5" y="56.5" width="439" height="207" rx="15.5" fill="none" stroke="#fff" stroke-opacity="0.10"/>
  <path d="M760.5 98.5h439" stroke="#fff" stroke-opacity="0.07"/>
  <circle cx="782" cy="77" r="5.5" fill="#FF5F57"/>
  <circle cx="800" cy="77" r="5.5" fill="#FEBC2E"/>
  <circle cx="818" cy="77" r="5.5" fill="#28C840"/>
  <text x="980" y="81" text-anchor="middle" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8E8E93">SFTPClient.swift</text>
  <g font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14.5" xml:space="preserve" fill="#E5E5EA">
    <text x="784" y="130"><tspan fill="#FC5FA3">import</tspan> SwiftSFTP</text>
    <text x="784" y="180"><tspan fill="#FC5FA3">try await</tspan> client.<tspan fill="#67B7A4">login</tspan>()</text>
    <text x="784" y="206"><tspan fill="#FC5FA3">let</tspan> items = <tspan fill="#FC5FA3">try await</tspan> client</text>
    <text x="784" y="232">    .<tspan fill="#67B7A4">contentsOfDirectory</tspan>(path: <tspan fill="#FC6A5D">"./Photos"</tspan>)</text>
  </g>
</svg>
