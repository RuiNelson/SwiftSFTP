<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="sftp-t">
  <title id="sftp-t">SwiftSFTP — Fast, resumable SFTP for Swift</title>
  <defs>
    <linearGradient id="sftp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="1" stop-color="#17151B"/>
    </linearGradient>
    <radialGradient id="sftp-glowL" cx="150" cy="160" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9F43" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF9F43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sftp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="0.55" stop-color="#FF6A2B"/>
      <stop offset="1" stop-color="#EE3B3B"/>
    </linearGradient>
    <linearGradient id="sftp-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sftp-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="1" stop-color="#FF5A36"/>
    </linearGradient>
    <!-- silk waves -->
    <linearGradient id="sftp-w1" gradientUnits="userSpaceOnUse" x1="520" y1="330" x2="1280" y2="30">
      <stop offset="0" stop-color="#EE3B3B" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FF5A36" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB340" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sftp-w2" gradientUnits="userSpaceOnUse" x1="540" y1="340" x2="1280" y2="110">
      <stop offset="0" stop-color="#FF6A2B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6A2B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF9F43" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sftp-w3" gradientUnits="userSpaceOnUse" x1="600" y1="340" x2="1280" y2="220">
      <stop offset="0" stop-color="#EE3B3B" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#EE3B3B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6A2B" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sftp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="sftp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#FF6A2B" flood-opacity="0.45"/>
    </filter>
    <filter id="sftp-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- a file card, centred on the origin -->
    <g id="sftp-file">
      <rect x="-21" y="-27" width="42" height="54" rx="8" fill="url(#sftp-card)" stroke="#fff" stroke-opacity="0.45"/>
      <path d="M5-27 21-11H9a4 4 0 0 1-4-4Z" fill="#fff" fill-opacity="0.35"/>
      <rect x="-12" y="-6" width="24" height="3" rx="1.5" fill="#fff" fill-opacity="0.45"/>
      <rect x="-12" y="0" width="16" height="3" rx="1.5" fill="#fff" fill-opacity="0.3"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#sftp-bg)"/>
  <rect width="1280" height="320" fill="url(#sftp-glowL)"/>

  <!-- Silk waves -->
  <path d="M520 330C700 330 780 130 970 150 1110 165 1180 90 1280 40V330Z" fill="url(#sftp-w1)"/>
  <path d="M540 340C740 330 800 200 980 215 1120 227 1190 170 1280 130V340Z" fill="url(#sftp-w2)"/>
  <path d="M600 340C780 340 850 260 1000 270 1120 278 1200 250 1280 230V340Z" fill="url(#sftp-w3)"/>
  <path d="M600 330C720 330 790 130 970 150 1110 165 1180 90 1280 40" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M640 338C760 328 810 200 980 215 1120 227 1190 170 1280 130" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- Transfer lanes -->
  <path d="M700 240C790 236 830 100 960 106S1170 42 1300 22" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M1300 168C1150 208 1080 160 950 212S800 280 700 292" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="48" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Files going up (left to right) -->
  <g filter="url(#sftp-soft)">
    <g opacity="0">
      <use href="#sftp-file"/>
      <text y="19" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">MOV</text>
      <animateMotion dur="10s" begin="0s" repeatCount="indefinite" path="M700 240C790 236 830 100 960 106S1170 42 1300 22"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <use href="#sftp-file"/>
      <text y="19" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">JPG</text>
      <animateMotion dur="10s" begin="-3.3s" repeatCount="indefinite" path="M700 240C790 236 830 100 960 106S1170 42 1300 22"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="10s" begin="-3.3s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <use href="#sftp-file"/>
      <text y="19" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">ZIP</text>
      <animateMotion dur="10s" begin="-6.6s" repeatCount="indefinite" path="M700 240C790 236 830 100 960 106S1170 42 1300 22"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="10s" begin="-6.6s" repeatCount="indefinite"/>
    </g>
    <!-- Files coming back (right to left) -->
    <g opacity="0">
      <use href="#sftp-file"/>
      <text y="19" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
      <animateMotion dur="12s" begin="-1s" repeatCount="indefinite" path="M1300 168C1150 208 1080 160 950 212S800 280 700 292"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="12s" begin="-1s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <use href="#sftp-file"/>
      <text y="19" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">RAW</text>
      <animateMotion dur="12s" begin="-7s" repeatCount="indefinite" path="M1300 168C1150 208 1080 160 950 212S800 280 700 292"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="12s" begin="-7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Twinkles -->
  <g fill="#fff">
    <circle cx="880" cy="52" r="1.8" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="34" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="92" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="150" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- App-icon tile -->
  <g filter="url(#sftp-glow)">
    <rect x="80" y="96" width="128" height="128" rx="30" fill="url(#sftp-tile)"/>
  </g>
  <rect x="80" y="96" width="128" height="128" rx="30" fill="url(#sftp-sheen)"/>
  <rect x="80.5" y="96.5" width="127" height="127" rx="29.5" fill="none" stroke="#fff" stroke-opacity="0.28"/>
  <path d="M108 144a8 8 0 0 1 8-8h20l8 8h28a8 8 0 0 1 8 8v30a8 8 0 0 1-8 8h-56a8 8 0 0 1-8-8z" fill="#fff" fill-opacity="0.96"/>
  <g fill="none" stroke="#F2502E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 183v-24M123.5 167l8.5-8.5 8.5 8.5"/>
    <path d="M156 159v24M147.5 175l8.5 8.5 8.5-8.5"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="248" y="106" font-size="13" font-weight="600" letter-spacing="2.6" fill="#FF8A4C">SWIFT PACKAGE</text>
    <text x="246" y="164" font-size="62" font-weight="700" letter-spacing="-1.8" fill="#fff">Swift<tspan fill="url(#sftp-word)">SFTP</tspan></text>
    <text x="248" y="198" font-size="22" font-weight="400" fill="#B4B4BC">Fast, resumable SFTP for Swift.</text>
    <text x="248" y="238" font-size="13.5" font-weight="500" letter-spacing="0.2" fill="#8E8E93">macOS  ·  iOS  ·  visionOS  ·  watchOS  ·  tvOS  ·  Linux  ·  Android</text>
  </g>
</svg>
