name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swift:6.3-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Swift version
        run: swift --version

      - name: Install system dependencies
        run: |
          apt-get update -q
          apt-get install -y libssl-dev pkg-config

      - name: Build
        run: swift build --scratch-path /tmp/swift-build -v

      # Swift Testing filters match test IDs (`SwiftSFTPTests.KeyValidationTests/…`), not display names, so a
      # filter that matches nothing passes silently; fail instead. Swift Testing prefixes its summary with a symbol.
      - name: Test (offline)
        shell: bash
        run: |
          set -o pipefail
          swift test --scratch-path /tmp/swift-test --filter "$OFFLINE_TEST_FILTER" 2>&1 | tee /tmp/swift-test-offline.log
          if grep -qE 'No matching test cases were run|Test run with 0 tests' /tmp/swift-test-offline.log; then
            echo "::error::Offline test filter '$OFFLINE_TEST_FILTER' executed zero tests" >&2
            exit 1
          fi
        env:
          OFFLINE_TEST_FILTER: "KeyValidationTests"
