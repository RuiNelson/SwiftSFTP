name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"

      - name: Swift version
        run: swift --version

      - name: Verify prepared OpenSSL sources
        run: |
          git -C Vendor/SwiftSFTP-OpenSSL submodule update --init --checkout Vendor/openssl
          python3 Vendor/SwiftSFTP-OpenSSL/Scripts/generate-openssl-sources.py --check
          python3 Scripts/update-openssl-manifest.py --check

      - name: Verify libssh2 adapters
        run: python3 Scripts/generate-libssh2-backend.py --check

      - name: Test foreign OpenSSL header precedence
        run: bash Tests/Packaging/CryptoIsolation/check-header-isolation.sh

      - name: Build
        run: swift build --scratch-path /tmp/swift-build --traits EXIFKit -v

      - name: Generate test keys and fixtures
        run: bash Scripts/generate-test-keys-and-fixtures.sh

      - name: Test (offline)
        run: |
          set -o pipefail
          swift test --scratch-path /tmp/swift-test --traits EXIFKit --filter "$OFFLINE_TEST_FILTER" 2>&1 | tee /tmp/swift-test-offline.log
          if grep -qE 'No matching test cases were run|^Test run with 0 tests' /tmp/swift-test-offline.log; then
            echo "::error::Offline test filter '$OFFLINE_TEST_FILTER' executed zero tests" >&2
            exit 1
          fi
        env:
          OFFLINE_TEST_FILTER: "CompressionTests|KeyValidationTests|KeyParsingRegressionTests|PrivateKeyTypesTests|SSHUserKeyAlgorithmTests|SFTPPathTests|SFTPWindowsPathTests|WindowsSFTPPathTests|SFTPFileHandleForEXIFKitTests"

      # Crypto validation can occupy the cooperative executor long enough to starve media timing checks.
      - name: Test AVFoundation (offline)
        run: |
          set -o pipefail
          swift test --scratch-path /tmp/swift-test --traits EXIFKit --filter AVFoundationUnitTests 2>&1 | tee /tmp/swift-test-media.log
          if grep -qE 'No matching test cases were run|Test run with 0 tests' /tmp/swift-test-media.log; then
            echo "::error::AVFoundation test filter executed zero tests" >&2
            exit 1
          fi

      - name: Test consumer crypto symbol isolation
        run: swift test --package-path Tests/Packaging/CryptoIsolation --scratch-path /tmp/swift-crypto-isolation

      # CryptoIsolation depends on the core product without the EXIFKit trait, so it must not resolve EXIFKit.
      - name: Check core consumers do not resolve EXIFKit
        shell: bash
        run: |
          if grep -qi '"exifkit"' Tests/Packaging/CryptoIsolation/Package.resolved; then
            echo "::error::A consumer of the core product resolved EXIFKit without enabling the EXIFKit trait" >&2
            exit 1
          fi

      - name: Test AVFoundation product consumer
        run: swift test --package-path Tests/Packaging/AVFoundation --scratch-path /tmp/swift-avfoundation-consumer

      - name: Test EXIFKit product consumer
        run: swift test --package-path Tests/Packaging/EXIFKitConsumer --scratch-path /tmp/swift-exifkit-consumer

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swift:6.4-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Swift version
        run: swift --version

      - name: Install source verification tools and build dependencies
        run: |
          apt-get update -q
          apt-get install -y python3 perl make openssl openssh-client zlib1g-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Vendor/SwiftSFTP-OpenSSL"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Vendor/SwiftSFTP-OpenSSL/Vendor/openssl"

      - name: Verify prepared OpenSSL sources
        run: |
          git -C Vendor/SwiftSFTP-OpenSSL submodule update --init --checkout Vendor/openssl
          python3 Vendor/SwiftSFTP-OpenSSL/Scripts/generate-openssl-sources.py --check
          python3 Scripts/update-openssl-manifest.py --check

      - name: Verify libssh2 adapters
        run: python3 Scripts/generate-libssh2-backend.py --check

      - name: Build
        run: swift build --scratch-path /tmp/swift-build --traits EXIFKit -v

      - name: Generate test keys and fixtures
        run: bash Scripts/generate-test-keys-and-fixtures.sh

      # Swift Testing filters match test IDs (`SwiftSFTPTests.KeyValidationTests/…`), not display names, so a
      # filter that matches nothing passes silently; fail instead. Swift Testing prefixes its summary with a symbol.
      - name: Test (offline)
        shell: bash
        run: |
          set -o pipefail
          swift test --scratch-path /tmp/swift-test --traits EXIFKit --filter "$OFFLINE_TEST_FILTER" 2>&1 | tee /tmp/swift-test-offline.log
          if grep -qE 'No matching test cases were run|Test run with 0 tests' /tmp/swift-test-offline.log; then
            echo "::error::Offline test filter '$OFFLINE_TEST_FILTER' executed zero tests" >&2
            exit 1
          fi
        env:
          OFFLINE_TEST_FILTER: "CompressionTests|KeyValidationTests|KeyParsingRegressionTests|PrivateKeyTypesTests|SSHUserKeyAlgorithmTests|SFTPPathTests|SFTPWindowsPathTests|WindowsSFTPPathTests|SFTPFileHandleForEXIFKitTests"

      - name: Test consumer crypto symbol isolation
        run: swift test --package-path Tests/Packaging/CryptoIsolation --scratch-path /tmp/swift-crypto-isolation

      # CryptoIsolation depends on the core product without the EXIFKit trait, so it must not resolve EXIFKit.
      - name: Check core consumers do not resolve EXIFKit
        shell: bash
        run: |
          if grep -qi '"exifkit"' Tests/Packaging/CryptoIsolation/Package.resolved; then
            echo "::error::A consumer of the core product resolved EXIFKit without enabling the EXIFKit trait" >&2
            exit 1
          fi

      - name: Test EXIFKit product consumer
        run: swift test --package-path Tests/Packaging/EXIFKitConsumer --scratch-path /tmp/swift-exifkit-consumer

  android:
    name: Android (aarch64)
    # Swift 6.4 toolchains are available for Ubuntu 24.04; ubuntu-latest can move beyond it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # setup-swift verifies the Swiftly download before Swiftly can import these keys itself.
      - name: Import Swift signing keys
        # swift.org sometimes answers runners with a page that is not the key block, so check what arrived and fall
        # back to the swift-org-website repository, which publishes the same file.
        run: |
          for url in \
            https://www.swift.org/keys/all-keys.asc \
            https://raw.githubusercontent.com/swiftlang/swift-org-website/main/keys/all-keys.asc; do
            if curl --fail --silent --show-error --location --retry 3 --output all-keys.asc "$url" \
              && grep --quiet -- '-----BEGIN PGP PUBLIC KEY BLOCK-----' all-keys.asc; then
              gpg --batch --import all-keys.asc
              rm all-keys.asc
              exit 0
            fi
            echo "::warning::No Swift signing keys at $url"
          done
          exit 1

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"

      - name: Checkout Swift SDK build scripts
        uses: actions/checkout@v5
        with:
          repository: swiftlang/github-workflows
          ref: "0.0.11"
          path: github-workflows

      - name: Install Swift SDK for Android and build
        run: |
          github-workflows/.github/workflows/scripts/install-and-build-with-sdk.sh \
            --android \
            --android-sdk-triple=aarch64-unknown-linux-android28 \
            --android-ndk-version=r27d \
            --build-command="swift build --scratch-path /tmp/swift-android-build --traits EXIFKit" \
            6.4
