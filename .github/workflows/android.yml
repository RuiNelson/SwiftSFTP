name: Android

on:
  push:
    branches: [main, android-support]
  pull_request:
    branches: [main, android-support]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_TRIPLE: aarch64-unknown-linux-android28
  ANDROID_ABI: arm64-v8a

jobs:
  android:
    name: Android (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.2"

      - name: Setup Swift Android SDK
        uses: orchetect/setup-swift-android-sdk@v1
        with:
          target-triple: ${{ env.TARGET_TRIPLE }}

      - name: Verify Android toolchain
        run: |
          swift --version
          swift sdk list
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          test -n "${ANDROID_NDK_HOME}"
          test -d "${ANDROID_NDK_HOME}"

      - name: Cache OpenSSL Android artifacts
        id: openssl-cache
        uses: actions/cache@v5
        with:
          path: Artifacts/OpenSSL/Android
          key: >-
            openssl-android-${{ runner.os }}-${{ env.ANDROID_ABI }}-
            ${{ hashFiles('Scripts/build-openssl-android.sh', 'vendor/openssl/Configure') }}

      - name: Build OpenSSL for Android
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: ./Scripts/build-openssl-android.sh

      - name: Build SwiftSFTP for Android
        run: ./AndroidBuild/build.sh

      - name: Build tests (Android)
        run: ./AndroidBuild/build.sh build --build-tests --scratch-path /tmp/swift-android-test
