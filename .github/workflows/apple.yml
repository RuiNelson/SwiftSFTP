name: Apple

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.2"

      - name: Swift version
        run: swift --version

      - name: Verify prepared OpenSSL sources
        run: python3 Scripts/generate-openssl-sources.py --check

      - name: Verify qualified libssh2 backend
        run: python3 Scripts/generate-libssh2-backend.py --check

      - name: Test foreign OpenSSL header precedence
        run: bash Tests/Packaging/CryptoIsolation/check-header-isolation.sh

      - name: Build
        run: swift build --scratch-path /tmp/swift-build -v

      - name: Test (offline)
        run: |
          set -o pipefail
          swift test --scratch-path /tmp/swift-test --filter "$OFFLINE_TEST_FILTER" 2>&1 | tee /tmp/swift-test-offline.log
          if grep -qE 'No matching test cases were run|^Test run with 0 tests' /tmp/swift-test-offline.log; then
            echo "::error::Offline test filter '$OFFLINE_TEST_FILTER' executed zero tests" >&2
            exit 1
          fi
        env:
          OFFLINE_TEST_FILTER: "KeyValidationTests|KeyParsingRegressionTests|PrivateKeyTypesTests|SSHUserKeyAlgorithmTests|SFTPPathTests|SFTPWindowsPathTests|WindowsSFTPPathTests"

      - name: Test consumer crypto symbol isolation
        run: swift test --package-path Tests/Packaging/CryptoIsolation --scratch-path /tmp/swift-crypto-isolation
