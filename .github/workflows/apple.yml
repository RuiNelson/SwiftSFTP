name: Apple

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.2"

      - name: Swift version
        run: swift --version

      - name: Cache OpenSSL XCFrameworks
        id: openssl-cache
        uses: actions/cache@v5
        with:
          path: Artifacts/OpenSSL
          key: >-
            openssl-xcframeworks-${{ runner.os }}-
            ${{ hashFiles('Scripts/build-openssl-xcframeworks.sh', 'vendor/openssl/Configure') }}

      - name: Build OpenSSL XCFrameworks
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: ./Scripts/build-openssl-xcframeworks.sh

      - name: Build
        run: swift build --scratch-path /tmp/swift-build -v

      - name: Test (offline)
        run: swift test --scratch-path /tmp/swift-test --filter "Key Validation"
